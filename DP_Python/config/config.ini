# =============================================================================
# Damages Prevented (DP_Python) settings - the only file to edit for a new year.
# Relative paths are relative to the DP_Python folder.
# =============================================================================

[water_year]
# The water year to download and analyze: WY2026 = 01Oct2025 - 30Sep2026.
# Everything for it goes in output/WY<year>/.
water_year = 2025

# Optional: a shorter period inside it (dates inclusive, e.g. 2025-01-15).
# Leave blank for the whole water year.
start =
end =

[paths]
# Each water year gets a folder here (output/WY2025/...)
output_dir = output

# The DSS file step 2 reads. Leave blank for the edited copy,
# output/WY<year>/2_edited_data/obsData.dss
obsdata_dss =

# The network exported from ResSim (ressim/ExportNetwork.py). Only changes
# when the ResSim network, routing or alternative mappings change.
network_json = config/network/network.json

[alternatives]
# Alternatives in network.json whose time series mappings are used
observed = Obs_NWP_H
unregulated = UnregNWP_H

[outputs]
# Plots of every control point and reservoir (yes/no)
make_plots = yes
