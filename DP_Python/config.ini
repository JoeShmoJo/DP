# cleaned in DSSVue. Set this to where your obsData.dss is, for example
#   C:/Projects/FIRO/watershed/NWP_Willamette_Master_2026_09_24_ScriptCleanup/scripts/DamagesPrevented/DP_Download/out/obsData.dss
obsdata_dss = C:/Projects/FIRO/watershed/NWP_Willamette_Master_2026_09_24_ScriptCleanup/scripts/DamagesPrevented/DP_Download/out/obsData.dss

# Network exported from ResSim with export/ExportNetwork.py
network_json = network/network.json

[alternatives]
# Names of the alternatives in network.json whose mappings DP_Python uses
observed = Obs_NWP_H
unregulated = UnregNWP_H
