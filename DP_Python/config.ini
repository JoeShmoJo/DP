# =============================================================================
# Damages Prevented (DP_Python) settings - the only file to edit for a new year.
# Paths may be absolute or relative to this folder (DP_Python).
# =============================================================================

[period]
# The water year to download and analyze (dates inclusive).
# The run covers start 00:00 through end 24:00, plus a one-hour lookback.
start = 2024-10-01
end = 2025-09-30

[paths]
# The observed data. Step 1 downloads it here; clean it in DSSVue before step 2.
obsdata_dss = data/obsData.dss

# The network exported from ResSim (network/ExportNetwork.py). Only changes
# when the ResSim network, routing or alternative mappings change.
network_json = network/network.json

[alternatives]
# Alternatives in network.json whose time series mappings are used
observed = Obs_NWP_H
unregulated = UnregNWP_H

[outputs]
# Each run of step 2 writes a new timestamped folder inside this one
output_dir = output
# Plots of every control point and reservoir (yes/no)
make_plots = yes
